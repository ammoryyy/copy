<!DOCTYPE html>
<html>
<head><title>Copying...</title></head>
<body style="background:#121212;">
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const textToCopy = urlParams.get('text') || '';
        if (textToCopy) {
            navigator.clipboard.writeText(textToCopy).then(() => window.close());
        } else {
            window.close();
        }
    </script>
</body>
</html>
